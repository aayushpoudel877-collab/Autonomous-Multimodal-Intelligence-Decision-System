services:
  aegismind:
    build: .
    ports: ["8000:8000"]
    environment:
      AEGISMIND_STORAGE_BACKEND: postgres
      AEGISMIND_POSTGRES_URL: postgresql://aegismind:aegismind@postgres:5432/aegismind
      AEGISMIND_DB_PATH: /app/data/aegismind.db
    depends_on:
      postgres:
        condition: service_healthy
    volumes: [aegismind-data:/app/data]
    restart: unless-stopped
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aegismind
      POSTGRES_USER: aegismind
      POSTGRES_PASSWORD: aegismind
    ports: ["5432:5432"]
    volumes: [aegismind-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U aegismind -d aegismind"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  aegismind-data:
  aegismind-postgres:
